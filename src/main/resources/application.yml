server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
inference:
  base-url: ${INFERENCE_BASE_URL:http://localhost:8000}
  model: ${INFERENCE_MODEL:}
  api-key: ${INFERENCE_API_KEY:}
  mode: ${INFERENCE_MODE:live}
  timeout-seconds: ${INFERENCE_TIMEOUT_SECONDS:45}

# 로컬 STT의 검증용 상한: 녹음 30초, 파일 2MiB. 음성은 디스크에 저장하지 않는다.
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 3MB
stt:
  base-url: ${STT_BASE_URL:http://127.0.0.1:8001}
  timeout-seconds: ${STT_TIMEOUT_SECONDS:120}

conversation:
  ttl-seconds: ${CONVERSATION_TTL_SECONDS:86400}
  cookie-secure: ${SESSION_COOKIE_SECURE:true}
